<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#061a35" />
  <title>AI Era — 3D Agent Network</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#06162c;
      --bg2:#082449;
      --cyan:#36dcff;
      --cyan2:#68f2ff;
      --blue:#268cff;
      --gold:#ffe36b;
      --text:#eafdff;
      --muted:#7fb5d8;
      --line:rgba(66,215,255,.18);
      --glass:rgba(2,15,32,.45);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;overflow:hidden}
    body{
      font-family:"Plus Jakarta Sans",sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 50% 48%,rgba(21,126,255,.22),transparent 24%),
        radial-gradient(circle at 50% 50%,#0b2d58 0%,#071e3d 42%,#041225 78%,#020a17 100%);
      -webkit-font-smoothing:antialiased;
    }
    #stage{position:fixed;inset:0;z-index:0}
    #stage canvas{display:block;width:100%;height:100%}

    .grain{
      position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.035;mix-blend-mode:screen;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.85'/%3E%3C/svg%3E");
    }
    .vignette{position:fixed;inset:0;z-index:3;pointer-events:none;box-shadow:inset 0 0 180px rgba(0,0,0,.48)}

    header{
      position:fixed;z-index:20;left:0;right:0;top:0;
      padding:18px 28px;display:flex;justify-content:space-between;align-items:center;
      border-bottom:1px solid rgba(77,205,255,.08);
      background:linear-gradient(180deg,rgba(3,12,27,.55),rgba(3,12,27,.08));
      backdrop-filter:blur(12px);
    }
    .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.03em}
    .brand-mark{
      width:22px;height:22px;border-radius:50%;
      border:2px solid var(--cyan2);
      box-shadow:0 0 16px rgba(76,224,255,.85),inset 0 0 10px rgba(76,224,255,.32);
      position:relative;
    }
    .brand-mark:before{
      content:"";position:absolute;inset:5px;border-radius:50%;background:var(--cyan2);
      box-shadow:0 0 14px var(--cyan2);
    }
    .status{
      font:500 .63rem "JetBrains Mono",monospace;letter-spacing:.08em;
      color:#8fdef3;border:1px solid rgba(78,225,255,.17);padding:7px 10px;border-radius:999px;
      background:rgba(4,25,48,.35);
    }

    .top-status{
      position:fixed;z-index:18;top:68px;left:50%;transform:translateX(-50%);
      padding:7px 12px;border-radius:999px;
      background:rgba(6,20,39,.64);border:1px solid rgba(255,227,107,.24);
      color:#ffe88a;font:500 .62rem "JetBrains Mono",monospace;letter-spacing:.06em;
      backdrop-filter:blur(12px);
      box-shadow:0 0 22px rgba(255,227,107,.08);
    }

    #labels{position:fixed;inset:0;z-index:12;pointer-events:none}
    .node-label{
      position:absolute;transform:translate(-50%,-50%);
      white-space:nowrap;pointer-events:auto;cursor:pointer;
      color:#d8f7ff;font-weight:600;font-size:clamp(10px,1vw,15px);
      text-shadow:0 0 10px rgba(62,215,255,.65);
      transition:.2s ease;
    }
    .node-label::before{
      content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;
      background:var(--node-color,#36dcff);
      box-shadow:0 0 12px var(--node-color,#36dcff),0 0 26px var(--node-color,#36dcff);
      vertical-align:1px;
    }
    .node-label.gold{color:#fff5b4}
    .node-label:hover,.node-label.active{
      transform:translate(-50%,-50%) scale(1.08);
      filter:brightness(1.25);
    }

    .core-label{
      position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
      width:235px;height:235px;border-radius:50%;display:grid;place-items:center;text-align:center;
      pointer-events:none;
    }
    .core-label strong{
      font-size:clamp(2.4rem,4.7vw,5.2rem);font-weight:800;letter-spacing:-.075em;line-height:.82;
      background:linear-gradient(110deg,#ffffff,#7cf4ff 42%,#5db7ff 68%,#ffe77d 100%);
      -webkit-background-clip:text;background-clip:text;color:transparent;
      filter:drop-shadow(0 0 10px rgba(90,229,255,.8)) drop-shadow(0 0 32px rgba(50,126,255,.65));
    }
    .core-label span{
      display:block;margin-top:12px;color:#b9f5ff;font:500 .58rem "JetBrains Mono",monospace;
      letter-spacing:.2em;text-transform:uppercase;text-shadow:0 0 12px rgba(72,217,255,.75);
    }

    .hud{
      position:fixed;z-index:16;left:28px;bottom:24px;width:260px;
      border:1px solid rgba(72,207,255,.1);border-radius:18px;padding:14px 16px;
      background:rgba(4,18,36,.48);backdrop-filter:blur(14px);
    }
    .hud h3{font-size:.73rem;margin-bottom:9px}
    .row{display:flex;justify-content:space-between;margin:7px 0;color:#6ca6c9;font:400 .61rem "JetBrains Mono",monospace}
    .row span:last-child{color:#8aefff}
    .hint{
      margin-top:10px;padding-top:10px;border-top:1px solid rgba(72,207,255,.08);
      color:#5f8baa;font-size:.65rem;line-height:1.5
    }

    .voice{
      position:fixed;z-index:17;bottom:20px;left:50%;transform:translateX(-50%);
      display:flex;flex-direction:column;align-items:center;gap:7px;
    }
    .wave{display:flex;align-items:center;gap:3px;height:22px}
    .wave i{
      display:block;width:2px;background:#ffe36b;border-radius:3px;box-shadow:0 0 8px rgba(255,227,107,.8);
      animation:wave 1.2s ease-in-out infinite;
    }
    .wave i:nth-child(1){height:7px}.wave i:nth-child(2){height:13px;animation-delay:.1s}
    .wave i:nth-child(3){height:20px;animation-delay:.2s}.wave i:nth-child(4){height:11px;animation-delay:.3s}
    .wave i:nth-child(5){height:17px;animation-delay:.4s}.wave i:nth-child(6){height:8px;animation-delay:.5s}
    .wave i:nth-child(7){height:15px;animation-delay:.6s}.wave i:nth-child(8){height:10px;animation-delay:.7s}
    @keyframes wave{0%,100%{transform:scaleY(.6);opacity:.55}50%{transform:scaleY(1.25);opacity:1}}
    .voice span{font:500 .56rem "JetBrains Mono",monospace;letter-spacing:.26em;color:#cceeff;text-transform:uppercase}

    @media(max-width:820px){
      header{padding:14px 16px}.status{display:none}
      .top-status{top:58px;font-size:.52rem}
      .hud{left:12px;bottom:12px;width:220px}
      .voice{bottom:14px}
      .core-label{width:180px;height:180px}
      .node-label{font-size:10px}
    }
  </style>

  <script type="importmap">
  {
    "imports":{
      "three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="stage"></div>
  <div id="labels">
    <div class="core-label"><div><strong>AI Era</strong><span>Core Intelligence</span></div></div>
  </div>

  <div class="grain"></div>
  <div class="vignette"></div>

  <header>
    <div class="brand"><span class="brand-mark"></span> AI ERA NETWORK</div>
    <div class="status">MULTI-AGENT ORCHESTRATION · ONLINE</div>
  </header>

  <div class="top-status">● SPEAKING · TAP TO STOP</div>

  <aside class="hud">
    <h3>Agent network telemetry</h3>
    <div class="row"><span>ACTIVE NODES</span><span id="nodeCount">16</span></div>
    <div class="row"><span>DATA FLOW</span><span id="flowVal">98%</span></div>
    <div class="row"><span>FOCUS</span><span id="focusVal">AI ERA</span></div>
    <div class="hint">Move mouse để tạo parallax. Kéo chuột trái để xoay mạng lưới. Click node để focus.</div>
  </aside>

  <div class="voice">
    <div class="wave">
      <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
    <span>Speaking</span>
  </div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const stage=document.querySelector('#stage');
const labelsRoot=document.querySelector('#labels');
const focusVal=document.querySelector('#focusVal');
const flowVal=document.querySelector('#flowVal');

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x06182f,.035);

const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,100);
camera.position.set(0,.5,16);

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
stage.appendChild(renderer.domElement);

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.35,.78,.07);
bloom.strength=1.3;
bloom.radius=.9;
bloom.threshold=.02;
composer.addPass(bloom);

scene.add(new THREE.AmbientLight(0x1b4678,.4));
const coreLight=new THREE.PointLight(0x4bdfff,40,38,2);
coreLight.position.set(0,0,2);scene.add(coreLight);
const goldLight=new THREE.PointLight(0xffe36b,13,20,2);
goldLight.position.set(-3,-3,4);scene.add(goldLight);

const world=new THREE.Group();
scene.add(world);

// ----- glow texture -----
function makeGlowTexture(){
  const c=document.createElement('canvas');c.width=c.height=256;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(.14,'rgba(80,230,255,.82)');
  g.addColorStop(.38,'rgba(30,125,255,.25)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g;x.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(c);
}
const glowTex=makeGlowTexture();

// ----- core -----
const coreGroup=new THREE.Group();world.add(coreGroup);

const core=new THREE.Mesh(
  new THREE.IcosahedronGeometry(1.4,5),
  new THREE.MeshPhysicalMaterial({
    color:0x0a4d80,emissive:0x0d9bd4,emissiveIntensity:2.15,
    metalness:.35,roughness:.2,clearcoat:1,clearcoatRoughness:.1,
    transmission:.08
  })
);
coreGroup.add(core);

const coreWire=new THREE.LineSegments(
  new THREE.WireframeGeometry(new THREE.IcosahedronGeometry(1.56,2)),
  new THREE.LineBasicMaterial({color:0x7df4ff,transparent:true,opacity:.16})
);
coreGroup.add(coreWire);

const aura=new THREE.Sprite(new THREE.SpriteMaterial({
  map:glowTex,color:0x38dfff,transparent:true,opacity:.72,
  blending:THREE.AdditiveBlending,depthWrite:false
}));
aura.scale.set(7.8,7.8,1);coreGroup.add(aura);

// gold core ring
const goldRing=new THREE.Mesh(
  new THREE.TorusGeometry(1.72,.055,16,180),
  new THREE.MeshBasicMaterial({color:0xffed75,transparent:true,opacity:.95})
);
goldRing.rotation.set(.35,.18,.08);
coreGroup.add(goldRing);

const goldGlow=new THREE.Mesh(
  new THREE.TorusGeometry(1.78,.12,16,180),
  new THREE.MeshBasicMaterial({color:0xffe36b,transparent:true,opacity:.16,blending:THREE.AdditiveBlending,depthWrite:false})
);
goldGlow.rotation.copy(goldRing.rotation);coreGroup.add(goldGlow);

// core particles
const corePCount=900;
const corePos=new Float32Array(corePCount*3);
for(let i=0;i<corePCount;i++){
  const r=Math.pow(Math.random(),.55)*1.25;
  const a=Math.random()*Math.PI*2;
  const b=Math.acos(THREE.MathUtils.randFloatSpread(2));
  corePos[i*3]=r*Math.sin(b)*Math.cos(a);
  corePos[i*3+1]=r*Math.cos(b);
  corePos[i*3+2]=r*Math.sin(b)*Math.sin(a);
}
const corePG=new THREE.BufferGeometry();
corePG.setAttribute('position',new THREE.BufferAttribute(corePos,3));
const coreParticles=new THREE.Points(corePG,new THREE.PointsMaterial({
  color:0x8df7ff,size:.024,transparent:true,opacity:.9,
  blending:THREE.AdditiveBlending,depthWrite:false
}));
coreGroup.add(coreParticles);

// concentric arcs
for(let i=0;i<5;i++){
  const ring=new THREE.Mesh(
    new THREE.TorusGeometry(2.4+i*.42,.012,8,200),
    new THREE.MeshBasicMaterial({color:i%2?0x258cff:0x3bdcff,transparent:true,opacity:.08+(4-i)*.01})
  );
  ring.rotation.set(.3+i*.17,.18+i*.14,.05+i*.11);
  ring.userData.speed=(i%2?-.001:.0014)*(i+1);
  coreGroup.add(ring);
}

// ----- nodes -----
const nodeData=[
  ['Strategist', -1.1, 4.4, -.2, 0x36dcff],
  ['Researcher', -4.3, 3.3, -.6, 0x36dcff],
  ['Chief of staff', -3.8, 1.8, .4, 0x36dcff],
  ['Finance', 2.7, 3.2, -.4, 0x36dcff],
  ['Editor', 5.6, 1.7, -.7, 0x36dcff],
  ['Memory', 3.5, .25, .7, 0x36dcff],
  ['Design', 4.2, -1.5, -.4, 0xffe36b],
  ['Engineering', 2.3, -3.0, .2, 0xffe36b],
  ['Social', -.2, -3.45, -.6, 0xffe36b],
  ['Ops', -3.2, -2.4, .3, 0xffe36b],
  ['Marketing', -4.0, -1.1, -.2, 0xffe36b],
  ['Sales', -5.0, -.15, -.4, 0xffe36b],
  ['Drive', 5.6, 3.0, -.2, 0x36dcff],
  ['Email', 6.1, -.8, .5, 0x258cff],
  ['Calendar', 5.0, -3.2, -.6, 0x36dcff],
  ['Analytics', -2.5, -4.0, -.8, 0x258cff]
];

const nodes=[];
nodeData.forEach((d,i)=>{
  const [name,x,y,z,color]=d;
  const g=new THREE.Group();g.position.set(x,y,z);world.add(g);

  const sphere=new THREE.Mesh(
    new THREE.SphereGeometry(.16,22,22),
    new THREE.MeshBasicMaterial({color})
  );
  g.add(sphere);

  const glow=new THREE.Sprite(new THREE.SpriteMaterial({
    map:glowTex,color,transparent:true,opacity:.72,blending:THREE.AdditiveBlending,depthWrite:false
  }));
  glow.scale.set(.95,.95,1);g.add(glow);

  const ring=new THREE.Mesh(
    new THREE.TorusGeometry(.28,.016,10,70),
    new THREE.MeshBasicMaterial({color,transparent:true,opacity:.55})
  );
  ring.rotation.x=1.1;g.add(ring);

  const el=document.createElement('div');
  el.className='node-label'+(color===0xffe36b?' gold':'');
  el.textContent=name;
  el.style.setProperty('--node-color','#'+color.toString(16).padStart(6,'0'));
  labelsRoot.appendChild(el);

  nodes.push({name,color,group:g,sphere,glow,ring,el,phase:i*.71});
  el.addEventListener('click',()=>focusNode(i));
});

// ----- connection curves -----
const connectionGroup=new THREE.Group();world.add(connectionGroup);
const curveLines=[];

function addConnection(a,b,color=0x2ccfff,opacity=.18,lift=.5){
  const p0=a.clone();
  const p2=b.clone();
  const mid=p0.clone().lerp(p2,.5);
  mid.z-=.8;
  mid.y+=lift;
  const curve=new THREE.QuadraticBezierCurve3(p0,mid,p2);
  const pts=curve.getPoints(80);
  const geo=new THREE.BufferGeometry().setFromPoints(pts);
  const mat=new THREE.LineBasicMaterial({
    color,transparent:true,opacity,
    blending:THREE.AdditiveBlending,depthWrite:false
  });
  const line=new THREE.Line(geo,mat);
  connectionGroup.add(line);
  curveLines.push({line,curve,phase:Math.random()*6.28});

  // moving data pulse
  const pulse=new THREE.Sprite(new THREE.SpriteMaterial({
    map:glowTex,color,transparent:true,opacity:.75,blending:THREE.AdditiveBlending,depthWrite:false
  }));
  pulse.scale.set(.35,.35,1);
  world.add(pulse);
  pulse.userData.curve=curve;
  pulse.userData.t=Math.random();
  pulse.userData.speed=.0015+Math.random()*.0026;
  pulse.userData.phase=Math.random()*6.28;
}

const origin=new THREE.Vector3(0,0,0);
nodes.forEach((n,i)=>{
  addConnection(origin,n.group.position.clone(),n.color,.17,.35+Math.sin(i)*.5);
});

// additional cross-connections
const pairs=[[0,1],[1,2],[2,10],[10,11],[3,4],[4,12],[4,5],[5,6],[6,14],[6,7],[7,8],[8,9],[9,10],[3,5],[1,11],[0,3],[8,15],[15,9],[12,4],[13,14]];
pairs.forEach((p,j)=>{
  const a=nodes[p[0]].group.position.clone();
  const b=nodes[p[1]].group.position.clone();
  addConnection(a,b,j%4===0?0xffe36b:0x258cff,j%4===0?.12:.095,(Math.random()-.5)*.7);
});

// faint horizontal circuit lines
const circuitMat=new THREE.LineBasicMaterial({color:0x38dfff,transparent:true,opacity:.08});
for(let i=0;i<16;i++){
  const y=THREE.MathUtils.randFloat(-4.2,4.2);
  const z=THREE.MathUtils.randFloat(-1.5,1.3);
  const left=-8.5,right=8.5;
  const p=[
    new THREE.Vector3(left,y,z),
    new THREE.Vector3(-6.8,y,z),
    new THREE.Vector3(-6.1,y+THREE.MathUtils.randFloatSpread(.7),z),
    new THREE.Vector3(-2.5,y+THREE.MathUtils.randFloatSpread(.5),z),
    new THREE.Vector3(2.4,y+THREE.MathUtils.randFloatSpread(.5),z),
    new THREE.Vector3(6.2,y,z),
    new THREE.Vector3(right,y,z)
  ];
  const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(p),circuitMat.clone());
  world.add(line);
}

// background stars
const count=innerWidth<800?800:1800;
const pos=new Float32Array(count*3);
for(let i=0;i<count;i++){
  pos[i*3]=THREE.MathUtils.randFloatSpread(24);
  pos[i*3+1]=THREE.MathUtils.randFloatSpread(15);
  pos[i*3+2]=THREE.MathUtils.randFloat(-14,4);
}
const pGeo=new THREE.BufferGeometry();
pGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));
const bgParticles=new THREE.Points(
  pGeo,
  new THREE.PointsMaterial({color:0x43cfff,size:.022,transparent:true,opacity:.48,blending:THREE.AdditiveBlending,depthWrite:false})
);
scene.add(bgParticles);

// focus / camera
let selected=-1;
let cameraTarget=new THREE.Vector3(0,0,0);
let targetCam=new THREE.Vector3(0,.5,16);
let pointerX=0,pointerY=0;
let dragging=false,lastX=0,lastY=0;
let rotX=0,rotY=0,targetRotX=0,targetRotY=0;

function focusNode(i){
  selected=i;
  const wp=nodes[i].group.getWorldPosition(new THREE.Vector3());
  const outward=wp.clone().normalize();
  targetCam=wp.clone().add(outward.multiplyScalar(3.8)).add(new THREE.Vector3(0,.3,3.2));
  cameraTarget.copy(wp);
  focusVal.textContent=nodes[i].name.toUpperCase();
  nodes.forEach((n,j)=>n.el.classList.toggle('active',j===i));
}

addEventListener('pointermove',e=>{
  pointerX=(e.clientX/innerWidth-.5)*2;
  pointerY=(e.clientY/innerHeight-.5)*2;
  if(dragging){
    const dx=e.clientX-lastX,dy=e.clientY-lastY;
    targetRotY+=dx*.006;
    targetRotX+=dy*.006;
    lastX=e.clientX;lastY=e.clientY;
  }
});
renderer.domElement.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  dragging=true;lastX=e.clientX;lastY=e.clientY;
});
addEventListener('pointerup',()=>dragging=false);
renderer.domElement.addEventListener('dblclick',()=>{
  selected=-1;targetCam.set(0,.5,16);cameraTarget.set(0,0,0);
  focusVal.textContent='AI ERA';
  nodes.forEach(n=>n.el.classList.remove('active'));
});

function updateLabels(){
  nodes.forEach(n=>{
    const p=n.group.getWorldPosition(new THREE.Vector3()).project(camera);
    const x=(p.x*.5+.5)*innerWidth;
    const y=(-p.y*.5+.5)*innerHeight;
    n.el.style.left=x+'px';
    n.el.style.top=y+'px';
    n.el.style.opacity=(p.z<1&&p.z>-1)?'1':'0';
  });
  const cp=coreGroup.getWorldPosition(new THREE.Vector3()).project(camera);
  const coreLabel=document.querySelector('.core-label');
  coreLabel.style.left=((cp.x*.5+.5)*innerWidth)+'px';
  coreLabel.style.top=((-cp.y*.5+.5)*innerHeight)+'px';
}

const clock=new THREE.Clock();
function animate(){
  const t=clock.getElapsedTime();

  if(!dragging && selected<0){
    targetRotY+=pointerX*.00018;
    targetRotX+=pointerY*.0001;
  }
  rotX+=(targetRotX-rotX)*.06;
  rotY+=(targetRotY-rotY)*.06;
  world.rotation.x=rotX+Math.sin(t*.16)*.015;
  world.rotation.y=rotY+Math.cos(t*.14)*.02;

  core.rotation.x=t*.08;
  core.rotation.y=t*.13;
  coreWire.rotation.x=-t*.06;
  coreWire.rotation.z=t*.05;
  coreParticles.rotation.y=-t*.1;
  goldRing.rotation.z=t*.11;
  goldGlow.rotation.z=t*.11;
  aura.material.opacity=.58+Math.sin(t*2.4)*.11;

  coreGroup.children.forEach(o=>{
    if(o.userData.speed){
      o.rotation.z+=o.userData.speed;
      o.rotation.y-=o.userData.speed*.45;
    }
  });

  nodes.forEach((n,i)=>{
    const p=1+Math.sin(t*2+n.phase)*.15+(selected===i?.22:0);
    n.sphere.scale.setScalar(p);
    n.glow.material.opacity=.5+Math.sin(t*1.7+n.phase)*.18+(selected===i?.22:0);
    n.ring.rotation.z+=.004*(i%2?1:-1);
    n.group.position.z=nodeData[i][3]+Math.sin(t*.65+n.phase)*.12;
  });

  curveLines.forEach(c=>{
    c.line.material.opacity=(c.line.material.color.getHex()===0xffe36b?.08:.07)+Math.max(0,Math.sin(t*1.7+c.phase))*.12;
  });

  world.children.forEach(o=>{
    if(o.isSprite && o.userData.curve){
      o.userData.t=(o.userData.t+o.userData.speed)%1;
      o.position.copy(o.userData.curve.getPointAt(o.userData.t));
      o.material.opacity=.35+Math.sin(t*5+o.userData.phase)*.3;
    }
  });

  bgParticles.rotation.y=t*.003;
  bgParticles.rotation.x=Math.sin(t*.1)*.018;

  if(selected<0){
    targetCam.set(pointerX*.18,.5-pointerY*.12,16);
    cameraTarget.lerp(new THREE.Vector3(0,0,0),.06);
  }
  camera.position.lerp(targetCam,.045);
  camera.lookAt(cameraTarget);

  flowVal.textContent=(94+Math.floor((Math.sin(t*1.4)+1)*3))+'%';

  updateLabels();
  composer.render();
}
renderer.setAnimationLoop(animate);

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
</script>
</body>
</html>
