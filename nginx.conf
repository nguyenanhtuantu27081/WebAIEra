server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # Enable Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/xml
        application/json
        image/svg+xml
        font/woff2;
    gzip_disable "MSIE [1-6]\.";

    # Block old spam folder and pages with 410 Gone (prefix match takes priority over regex)
    location ^~ /androids {
        return 410;
    }

    # Block C# and other backend file formats from previous sites
    location ~* \.(aspx|ashx|asmx|asp|php)$ {
        return 410;
    }

    # Block access to configuration and Docker files
    location ~* (nginx\.conf|dockerfile|\.dockerignore|\.env)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to hidden files/directories (starting with a dot)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Cache static assets (images, css, js, fonts)
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|css|js|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        log_not_found off;
    }

    # Static site routing fallback
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
