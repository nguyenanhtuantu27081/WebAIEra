services:
  webaiera:
    image: ghcr.io/nguyenanhtuantu27081/webaiera:latest
    container_name: webaiera
    restart: always
    ports:
      - "80:80"
    environment:
      - TZ=Asia/Ho_Chi_Minh
    logging:
      driver: "json-file"
      options:
        max-size: "3m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
